name: Sandbox service synthetic proof
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  service-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: proof
          POSTGRES_PASSWORD: synthetic-ci
          POSTGRES_DB: connector_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proof -d connector_proof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run proof
        env:
          RAMP_TEST_DATABASE_URL: postgres://proof:synthetic-ci@127.0.0.1:5432/connector_proof
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sandbox-service-synthetic-proof
          path: service/artifacts/
